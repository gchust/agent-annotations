name: publish npm
run-name: Publish v${{ inputs.version }} to npm (${{ inputs.dist_tag }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in package.json
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::npm releases must run from main"
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Confirm package version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import manifest from "./package.json" with { type: "json" };
            if (manifest.version !== process.env.EXPECTED_VERSION) {
              throw new Error(`package.json is ${manifest.version}, not ${process.env.EXPECTED_VERSION}`);
            }
            console.log(`${manifest.name}@${manifest.version}`);
          '

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify release candidate
        run: pnpm release:verify
      - name: Repeat exact-candidate browser verification
        run: pnpm test:e2e:repeat

      - name: Locate verified tarball
        id: candidate
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const candidate = JSON.parse(readFileSync("artifacts/release-candidate/metadata.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${candidate.tarball}\n`);
          '

      - name: Publish verified tarball
        env:
          NPM_TAG: ${{ inputs.dist_tag }}
          TARBALL: ${{ steps.candidate.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --tag "$NPM_TAG" --provenance --ignore-scripts
