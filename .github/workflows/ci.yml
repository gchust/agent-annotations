name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:architecture
      - run: pnpm check:docs
      - name: Full test suite (Linux)
        if: runner.os == 'Linux'
        run: pnpm test
      - name: Portable Goal 09 gates (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/client/runtime.test.ts tests/components/accessibility.test.ts tests/extension/registry.test.ts tests/server/vite.test.ts
      - name: Install Chromium for the packed E2E
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Fresh packed E2E (Linux)
        if: runner.os == 'Linux'
        run: pnpm test:e2e

  release:
    name: release verify (ubuntu / node 20)
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies for the packed E2E
        run: pnpm exec playwright install --with-deps chromium
      # The complete release gate: typecheck, tests, architecture/docs audits,
      # package/tarball checks and the packed consumer E2E, all in one command.
      # No continue-on-error and no dependency on matrix jobs: a single failed
      # spec or gate fails this job.
      - name: Full release verification
        run: pnpm release:verify
